[package]
name = "speed"
version = "0.1.0"
edition = "2021"
description = "Tiny self-hosted speed test for Tailscale: throughput, latency, and whether the path is direct or relayed."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
